# USAGE:
# After reviewing the code, core team members may comment on a PR with `!build` followed by optional `<target>` and `<profile>` arguments.
# This extends the syntax of the `cargo run build` CLI command, allowing several targets and specific platforms to be built at once.
#
# `<target>`: any of `web`, `desktop` (all platforms), `desktop:<platforms>`, or a bare platform (`windows`, `mac`, `linux`), joined by spaces or `+` (default: `web`)
#             `flatpak` additionally packages the Linux build as a Flatpak, which `desktop` and `linux` leave out
# `<profile>`: `release` (default) or `debug`
#
# Only the comment's first line is parsed, so notes may follow on the lines below it.
#
# Examples:
# - !build
# - !build debug
# - !build desktop
# - !build web desktop
# - !build linux
# - !build linux+flatpak
# - !build desktop:windows+mac
# - !build web+desktop:linux debug
name: "!build PR Command"

on:
  issue_comment:
    types:
      - created

jobs:
  setup:
    # Command should be limited to core team members (those in the organization) for security.
    # From the GitHub Actions docs:
    # author_association = 'MEMBER': Author is a member of the organization that owns the repository.
    if: >
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'MEMBER' &&
      startsWith(github.event.comment.body, '!build')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      repo: ${{ steps.pr_info.outputs.repo }}
      ref: ${{ steps.pr_info.outputs.ref }}
      web: ${{ steps.pr_info.outputs.web }}
      windows: ${{ steps.pr_info.outputs.windows }}
      mac: ${{ steps.pr_info.outputs.mac }}
      linux: ${{ steps.pr_info.outputs.linux }}
      flatpak: ${{ steps.pr_info.outputs.flatpak }}
      debug: ${{ steps.pr_info.outputs.debug }}

    steps:
      - name: 🔎 Parse command, find branch, and set build flags
        id: pr_info
        env:
          # Passed through the environment so the comment text can't inject shell syntax
          COMMENT: ${{ github.event.comment.body }}
        run: |
          # Split the first line into space-separated words (comments posted from the web UI have CRLF line endings)
          read -ra WORDS <<< "${COMMENT%%$'\r'*}"

          # First word must be "!build"
          if [[ "${WORDS[0]}" != "!build" ]]; then
            echo "::error::Expected comment to start with !build"
            exit 1
          fi

          # Initialize build flags
          WEB="false"
          WINDOWS="false"
          MAC="false"
          LINUX="false"
          FLATPAK="false"
          DEBUG="false"
          PROFILE=""

          # Every remaining word is either the profile or a `+`-separated list of targets
          for WORD in "${WORDS[@]:1}"; do
            case "$WORD" in
              "debug" | "release")
                if [[ -n "$PROFILE" ]]; then
                  echo "::error::Profile given more than once: $WORD"
                  exit 1
                fi
                PROFILE="$WORD"
                if [[ "$WORD" == "debug" ]]; then DEBUG="true"; fi
                continue
                ;;
            esac

            IFS='+' read -ra PARTS <<< "$WORD"
            for PART in "${PARTS[@]}"; do
              # In `desktop:<platforms>`, the prefix only matters on the first platform since the others are split off as bare platforms
              case "$PART" in
                "web")                         WEB="true" ;;
                "desktop")                     WINDOWS="true"; MAC="true"; LINUX="true" ;;
                "windows" | "desktop:windows") WINDOWS="true" ;;
                "mac" | "desktop:mac")         MAC="true" ;;
                "linux" | "desktop:linux")     LINUX="true" ;;
                "flatpak" | "desktop:flatpak") LINUX="true"; FLATPAK="true" ;;
                *) echo "::error::Unrecognized argument: $PART"; exit 1 ;;
              esac
            done
          done

          # Without any target, build for web to match the CLI default target
          if [[ "$WEB$WINDOWS$MAC$LINUX" != *true* ]]; then
            WEB="true"
          fi

          # Write parsed build flags to job outputs
          echo "web=$WEB" >> $GITHUB_OUTPUT
          echo "windows=$WINDOWS" >> $GITHUB_OUTPUT
          echo "mac=$MAC" >> $GITHUB_OUTPUT
          echo "linux=$LINUX" >> $GITHUB_OUTPUT
          echo "flatpak=$FLATPAK" >> $GITHUB_OUTPUT
          echo "debug=$DEBUG" >> $GITHUB_OUTPUT

          # Fetch the PR's head branch and repo (needed for forked PRs where the code lives in another repo)
          RESPONSE=$(curl -L -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
          echo "repo=$(echo $RESPONSE | jq -r '.head.repo.full_name')" >> $GITHUB_OUTPUT
          echo "ref=$(echo $RESPONSE | jq -r '.head.ref')" >> $GITHUB_OUTPUT

      - name: 💬 Edit comment with workflow run link
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            github.rest.issues.updateComment({
              comment_id: ${{ github.event.comment.id }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: context.payload.comment.body + ' ([Run ID ' + context.runId + '](https://github.com/GraphiteEditor/Graphite/actions/runs/' + context.runId + '))'
            });

  invoke-build:
    needs: setup
    uses: ./.github/workflows/build.yml
    # The called workflow's jobs can only narrow these, so this grants the union of what they request
    permissions:
      actions: write
      contents: write
      deployments: write
      id-token: write
      pull-requests: write
    secrets: inherit
    with:
      web: ${{ needs.setup.outputs.web == 'true' }}
      windows: ${{ needs.setup.outputs.windows == 'true' }}
      mac: ${{ needs.setup.outputs.mac == 'true' }}
      linux: ${{ needs.setup.outputs.linux == 'true' }}
      flatpak: ${{ needs.setup.outputs.flatpak == 'true' }}
      debug: ${{ needs.setup.outputs.debug == 'true' }}
      checkout_repo: ${{ needs.setup.outputs.repo }}
      checkout_ref: ${{ needs.setup.outputs.ref }}
      pr_number: ${{ github.event.issue.number }}
