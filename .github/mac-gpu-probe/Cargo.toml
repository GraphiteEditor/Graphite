[package]
name = "mac-gpu-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Kept out of the repository's workspace
[workspace]

[dependencies]
wgpu = { version = "30.0", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
