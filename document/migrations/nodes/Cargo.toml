[package]
name = "migration-nodes"
description = "Node migrations of Graphite documents, scaffolded by `cargo run migration new`"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
migration-core = { workspace = true, features = ["typed"] }
serde = { workspace = true }

[dev-dependencies]
document-graph-storage = { workspace = true, default-features = false }
migration-runner = { workspace = true, features = ["testing"] }
