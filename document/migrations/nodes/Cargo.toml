[package]
name = "migration-nodes"
description = "Node migrations of Graphite documents, scaffolded by `cargo run migration new`"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
migration-core = { workspace = true, features = ["typed"] }
serde = { workspace = true }

[dev-dependencies]
migration-runner = { workspace = true, features = ["testing"] }

[package.metadata.cargo-shear]
# Frozen mirrors of stored values, once a node migration needs one
ignored = ["serde"]
