[package]
name = "migration-runner"
description = "Applies Graphite document migrations across the format and node tiers"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Fixtures and history properties for migrations' tests, as `migration_runner::testing`.
testing = []

[dependencies]
migration-core = { workspace = true, features = ["typed"] }
document-graph-storage = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
migration-runner = { path = ".", features = ["testing"] }
serde = { workspace = true }
serde_json = { workspace = true }
