[package]
name = "web-editor-driver"
description = "Drives the Graphite web editor the way a person does, with real mouse and keyboard input, for scripts, QA, and agents"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Local dependencies
graphite-editor-control-protocol = { workspace = true }

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# Other dependencies
image = { version = "0.25", default-features = false, features = ["png"] }
interprocess = "2.4.2"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
