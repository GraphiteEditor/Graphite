[workspace]
members = [
	"desktop",
	"desktop/wrapper",
	"desktop/ui",
	"desktop/embedded-resources",
	"desktop/bundle",
	"desktop/platform/linux",
	"desktop/platform/mac",
	"desktop/platform/win",
	"document/format",
	"document/graph-storage",
	"document/container",
	"document/migrations/core",
	"document/migrations/macros",
	"document/migrations/runner",
	"document/migrations/formats",
	"document/migrations/snapshot",
	"document/migrations/nodes",
	"document/peer-transport",
	"editor",
	"frontend/wrapper",
	"libraries/dyn-any",
	"libraries/math-parser",
	"libraries/ipsum",
	"libraries/snapping",
	"libraries/wgpu-sync",
	"libraries/control-protocol",
	"node-graph/libraries/graphene-hash",
	"node-graph/libraries/*",
	"node-graph/nodes/*",
	"node-graph/graph-craft",
	"node-graph/graphene-cli",
	"node-graph/nodes/gstd",
	"node-graph/interpreted-executor",
	"node-graph/node-macro",
	"node-graph/preprocessor",
	"proc-macros",
	"tools/cargo-run",
	"tools/cargo-run/internal/*",
	"tools/crate-hierarchy-viz",
	"tools/third-party-licenses",
	"tools/editor-message-tree",
	"tools/node-docs",
	"tools/regression",
	"tools/web-editor-driver",
]
default-members = [
	"editor",
	"frontend/wrapper",
	"libraries/dyn-any",
	"libraries/math-parser",
	"libraries/ipsum",
	"libraries/snapping",
	"node-graph/graph-craft",
	"node-graph/interpreted-executor",
	"node-graph/node-macro",
	"node-graph/preprocessor",
	# blocked by https://github.com/rust-lang/cargo/issues/16000
#	"proc-macros",
	"tools/cargo-run",
]
resolver = "2"

[workspace.package]
rust-version = "1.98"
edition = "2024"
authors = ["Graphite Authors <contact@graphite.art>"]
homepage = "https://graphite.art"
repository = "https://github.com/GraphiteEditor/Graphite"
license = "MIT OR Apache-2.0"
version = "0.0.0"
readme = "README.md"
publish = false

[workspace.dependencies]
# Local dependencies
dyn-any = { path = "libraries/dyn-any", features = [
	"derive",
	"glam",
	"reqwest",
	"log-bad-types",
	"rc",
] }
graphene-hash = { path = "node-graph/libraries/graphene-hash", features = ["derive"] }
preprocessor = { path = "node-graph/preprocessor" }
math-parser = { path = "libraries/math-parser" }
graphene-application-io = { path = "node-graph/libraries/application-io" }
graphene-resource = { path = "node-graph/libraries/resources" }
graphene-animation = { path = "node-graph/libraries/animation" }
core-types = { path = "node-graph/libraries/core-types" }
no-std-types = { path = "node-graph/libraries/no-std-types" }
raster-types = { path = "node-graph/libraries/raster-types" }
vector-types = { path = "node-graph/libraries/vector-types" }
graphic-types = { path = "node-graph/libraries/graphic-types" }
brush-types = { path = "node-graph/libraries/brush-types" }
rendering = { path = "node-graph/libraries/rendering" }
brush-nodes = { path = "node-graph/nodes/brush" }
blending-nodes = { path = "node-graph/nodes/blending" }
graphene-core = { path = "node-graph/nodes/gcore" }
graphic-nodes = { path = "node-graph/nodes/graphic" }
text-nodes = { path = "node-graph/nodes/text" }
transform-nodes = { path = "node-graph/nodes/transform" }
vector-nodes = { path = "node-graph/nodes/vector" }
repeat-nodes = { path = "node-graph/nodes/repeat" }
vectorize-nodes = { path = "node-graph/nodes/vectorize" }
math-nodes = { path = "node-graph/nodes/math" }
path-bool-nodes = { path = "node-graph/nodes/path-bool" }
graph-craft = { path = "node-graph/graph-craft" }
document-format = { path = "document/format" }
document-graph-storage = { path = "document/graph-storage", default-features = false }
document-container = { path = "document/container" }
migration-core = { path = "document/migrations/core", default-features = false }
migration-macros = { path = "document/migrations/macros" }
migration-runner = { path = "document/migrations/runner" }
migration-formats = { path = "document/migrations/formats" }
migration-nodes = { path = "document/migrations/nodes" }
peer-transport = { path = "document/peer-transport" }
raster-nodes = { path = "node-graph/nodes/raster" }
graphene-std = { path = "node-graph/nodes/gstd" }
interpreted-executor = { path = "node-graph/interpreted-executor" }
node-macro = { path = "node-graph/node-macro" }
wgpu-executor = { path = "node-graph/libraries/wgpu-executor" }
wgpu-sync = { path = "libraries/wgpu-sync" }
graphite-proc-macros = { path = "proc-macros" }
graphite-editor = { path = "editor" }
control-protocol = { path = "libraries/control-protocol" }
graphene-canvas-utils = { path = "node-graph/libraries/canvas-utils" }
ipsum = { path = "libraries/ipsum" }
snapping = { path = "libraries/snapping" }

# Workspace dependencies
rustc-hash = "2.0"
bytemuck = { version = "1.13", features = ["derive", "min_const_generics"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rmp-serde = "1.3"
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6"
reqwest = { version = "0.13", features = ["blocking", "json"] }
futures = "0.3"
env_logger = "0.11"
log = "0.4"
bitflags = { version = "2.4", features = ["serde"] }
ctor = "0.2"
convert_case = "0.12"
titlecase = "3.6"
fancy-regex = "0.18.0"
unicode-segmentation = "1.13.2"
indoc = "2.0.5"
derivative = "2.2"
thiserror = "2"
anyhow = "1.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1.0"
chrono = "0.4"
ron = "0.12"
fastnoise-lite = "1.1"
wgpu = { version = "30.0", default-features = false, features = [
	"std",
	"parking_lot",
	"dx12",
	"metal",
	"vulkan",
	"gles",
	"wgsl",
	# The web build renders with WebGL2 rather than the less widely supported and less stable WebGPU
	"webgl",
	# We don't have wgpu on multiple threads (yet) https://github.com/gfx-rs/wgpu/blob/trunk/CHANGELOG.md#wgpu-types-now-send-sync-on-wasm
	"fragile-send-sync-non-atomic-wasm",
	"strict_asserts",
] }
once_cell = "1.13" # Remove and replace with `core::cell::LazyCell` (<https://doc.rust-lang.org/core/cell/struct.LazyCell.html>)
wasm-bindgen = "=0.2.127" # NOTICE: keep in sync with the `wasm-bindgen-cli` version pinned in `.github/workflows/build.yml`, `.devcontainer/devcontainer.json`, `.nix/dev.nix`, `.nix/pkgs/graphite.nix`, and `tools/cargo-run/src/requirements.rs`. We pin this version because wasm-bindgen upgrades may break various things.
wasm-bindgen-futures = "0.4"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = [
	"Document",
	"DomRect",
	"Element",
	"HtmlCanvasElement",
	"CanvasRenderingContext2d",
	"CanvasPattern",
	"OffscreenCanvas",
	"OffscreenCanvasRenderingContext2d",
	"TextMetrics",
	"Window",
	"IdleRequestOptions",
	"ImageData",
	"Navigator",
	"Gpu",
	"HtmlImageElement",
	"ImageBitmapRenderingContext",
] }
winit = "0.31.0-beta.4"
keyboard-types = "0.8"
url = "2.5"
tokio = { version = "1.29", features = ["fs", "macros", "io-std", "rt", "rt-multi-thread"] }
# Linebender ecosystem (BEGIN)
kurbo = { version = "0.13", features = ["serde"] }
vello_gpu = { version = "0.3", default-features = false, features = ["wgpu", "full_image_support"] }
usvg = "0.47"
simplecss = "0.2"
parley = { version = "0.9", default-features = false, features = ["std"] }
skrifa = "0.42"
polycool = "0.4"
color = "0.3"
# Linebender ecosystem (END)
rand = { version = "0.9", default-features = false, features = ["std_rng"] }
rand_chacha = "0.9"
glam = { version = "0.33", default-features = false, features = [
	"nostd-libm",
	"scalar-math",
	"bytemuck",
	"debug-glam-assert",
	"all-types",
] }
base64 = "0.22"
blake3 = "1.5"
mmap-io = { version = "0.9", features = ["hugepages"] }
image = { version = "0.25", default-features = false, features = [
	"png",
	"jpeg",
	"bmp",
	"gif",
	"webp",
	"tiff",
	"ico",
	"tga",
	"hdr",
	"exr",
	"serde",
] }
pretty_assertions = "1.4"
fern = { version = "0.7", features = ["colored"] }
num_enum = { version = "0.7", default-features = false }
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
tsify = { version = "0.5", default-features = false, features = ["js"] }
syn = { version = "2.0", default-features = false, features = [
	"full",
	"derive",
	"parsing",
	"printing",
	"visit-mut",
	"visit",
	"clone-impls",
	"extra-traits",
	"proc-macro",
] }
lyon_geom = "1.0"
delaunator = "1.0"
robust = "1.2"
petgraph = { version = "0.7", default-features = false, features = ["graphmap"] }
half = { version = "2.4", default-features = false, features = ["bytemuck"] }
tinyvec = { version = "1", features = ["std"] }
criterion = { version = "0.7", features = ["html_reports"] }
gungraun = { version = "0.18" }
ndarray = "0.16"
ollev = "0.1.1"
dirs = "6.0"
cef = "156"
cef-dll-sys = "156"
include_dir = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
rfd = "0.17"
open = "5.3"
spin = "0.10"
clap = "4.5"
qrcodegen = "1.8"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
scraper = "0.25"
linesweeper = "0.4"
smallvec = "1.13.2"
zip = { version = "8", default-features = false }

[workspace.lints]

[profile.dev]
opt-level = 1

[profile.dev.package]
no-std-types = { opt-level = 1 }
core-types= { opt-level = 1 }
interpreted-executor = { opt-level = 1 } # This is a mitigation for https://github.com/rustwasm/wasm-pack/issues/981 which is needed because the node_registry function is too large
graphite-proc-macros = { opt-level = 1 }
image = { opt-level = 2 }
rustc-hash = { opt-level = 3 }
serde_derive = { opt-level = 1 }
syn = { opt-level = 1 }
node-macro = { opt-level = 2 }

[profile.release]
lto = "thin"
debug = true

[patch.crates-io]
rfd = { git = "https://github.com/timon-schelling/rfd.git", branch = "graphite" } # TODO: Remove this once https://github.com/PolyMeilex/rfd/pull/317 is merged and released
# TODO: Remove these once the fork's fixes are upstreamed and released
vello_gpu = { git = "https://github.com/Keavon/vello.git", rev = "f20a8dde35de04c44d05e88b33864f27ad7d6f70" }
vello_common = { git = "https://github.com/Keavon/vello.git", rev = "f20a8dde35de04c44d05e88b33864f27ad7d6f70" }
vello_gpu_shaders = { git = "https://github.com/Keavon/vello.git", rev = "f20a8dde35de04c44d05e88b33864f27ad7d6f70" }
