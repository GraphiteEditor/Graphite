[package]
name = "raster-nodes"
description = "Raster operation nodes for Graphene"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["serde"]
serde = ["dep:serde", "core-types/serde", "raster-types/serde", "vector-types/serde"]
wasm = [
	"core-types/wasm",
	"raster-types/wasm",
	"vector-types/wasm",
	"tsify",
	"wasm-bindgen",
]

[dependencies]
# Local dependencies
no-std-types = { workspace = true }
node-macro = { workspace = true }
dyn-any = { workspace = true }
core-types = { workspace = true }
graphene-core = { workspace = true }
graphene-resource = { workspace = true }
graphene-hash = { workspace = true }
raster-types = { workspace = true }
vector-types = { workspace = true }
wgpu-executor = { workspace = true }

# Workspace dependencies
bytemuck = { workspace = true }
glam = { workspace = true }
num_enum = { workspace = true }
image = { workspace = true }
ndarray = { workspace = true }
serde = { workspace = true, optional = true }
color = { workspace = true }
thiserror = { workspace = true }

# Workspace Wasm dependencies
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
