[package]
name = "graphene-canvas-utils"
description = "graphene canvas utilities"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
wgpu = ["dep:graphene-application-io", "dep:log", "dep:wgpu", "dep:wgpu-executor"]

# The library has no functionality outside WebAssembly
[target.'cfg(target_family = "wasm")'.dependencies]
# Local dependencies
dyn-any = { workspace = true }

# Workspace dependencies
web-sys = { workspace = true }
glam = { workspace = true }

# Optional local dependencies
graphene-application-io = { workspace = true, optional = true }

# Optional workspace dependencies
log = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
wgpu-executor = { workspace = true, optional = true }
