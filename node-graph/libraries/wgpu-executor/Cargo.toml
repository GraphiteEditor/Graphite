[package]
name = "wgpu-executor"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Local dependencies
core-types = { workspace = true }
graphic-types = { workspace = true }
raster-kernels = { workspace = true }
raster-types = { workspace = true, features = ["wgpu"] }
graphene-application-io = { workspace = true, features = ["wgpu"] }
rendering = { workspace = true }
dyn-any = { workspace = true }
node-macro = { workspace = true }

# Workspace dependencies
glam = { workspace = true }
anyhow = { workspace = true }
wgpu = { workspace = true }
wgpu-sync = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
web-sys = { workspace = true }
vello_gpu = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true }
fastnoise-lite = { workspace = true, features = ["wgsl"] }

[dev-dependencies]
# Local dependencies
graphene-resource = { workspace = true }

# Required dependencies
# Turns on the shader translators of every backend for the tests, whichever of them the platform's own backends build with
naga = { version = "30.0", features = ["wgsl-in", "glsl-out", "hlsl-out", "msl-out", "spv-out"] }
