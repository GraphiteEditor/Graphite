[package]
name = "no-std-types"
description = "Color and blending types for Graphene"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
wasm = ["tsify", "wasm-bindgen"]

[dependencies]
# Local dependencies
node-macro = { workspace = true }
dyn-any = { workspace = true }
graphene-hash = { workspace = true }

# Workspace dependencies
bytemuck = { workspace = true }
glam = { workspace = true, features = ["debug-glam-assert", "std", "serde"] }
half = { workspace = true, features = ["std", "serde"] }
num-derive = { workspace = true }
num-traits = { workspace = true, features = ["std"] }
num_enum = { workspace = true, features = ["std"] }
serde = { workspace = true }
log = { workspace = true }

# Workspace wasm dependencies
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
core-types = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["core-types"]
