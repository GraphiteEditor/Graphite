[package]
name = "core-types"
description = "Core types and traits for Graphene node system"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["serde"]
serde = ["dep:serde", "glam/serde", "half/serde"]
type_id_logging = []
dealloc_nodes = []
wasm = ["tsify", "wasm-bindgen"]

[dependencies]
# Local dependencies
graphene-hash = { workspace = true, features = ["derive"] }

# Workspace dependencies
color = { workspace = true }
bitflags = { workspace = true }
bytemuck = { workspace = true }
node-macro = { workspace = true }
num-traits = { workspace = true }
num-derive = { workspace = true }
num_enum = { workspace = true, features = ["std"] }
half = { workspace = true, features = ["std"] }
rand = { workspace = true }
glam = { workspace = true }
serde_json = { workspace = true }
petgraph = { workspace = true }
rustc-hash = { workspace = true }
dyn-any = { workspace = true }
ctor = { workspace = true }
rand_chacha = { workspace = true }
image = { workspace = true }
tinyvec = { workspace = true }
parley = { workspace = true }
skrifa = { workspace = true }
kurbo = { workspace = true }
lyon_geom = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
polycool = { workspace = true }
futures = { workspace = true }
web-time = { workspace = true }

# Optional workspace dependencies
serde = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
# Workspace dependencies
serde_json = { workspace = true }
